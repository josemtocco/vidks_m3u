name: Update VidKS Playlist

on:
  schedule:
    # A cada 6 horas (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater
        run: python scripts/update_playlist.py
        # Se o IP do GitHub for bloqueado (403), o script termina com exit 1.
        # Nesse caso o passo falha e nenhum commit é feito (comportamento desejado).

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update playlist $(date -u +'%Y-%m-%d %H:%M UTC')"
          file_pattern: "data/*"
          commit_user_name: "vidks-bot"
          commit_user_email: "bot@users.noreply.github.com"
