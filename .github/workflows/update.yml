name: Atualizar playlist M3U

on:
  schedule:
    - cron: "0 */6 * * *"     # a cada 6 horas (UTC)
  workflow_dispatch:           # execução manual

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar coletor
        run: python scraper.py

      - name: Commit da lista
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u channels.json
          git diff --staged --quiet || git commit -m "Atualização automática $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
